<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Industrial Edge AI Thermal Mitigation and Synchronized Strobe Illumination Architecture">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <pattern id="grid4" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.8" />
    </pattern>
  </defs>

  <rect width="960" height="480" fill="url(#bgGrad4)" />
  <rect width="960" height="480" fill="url(#grid4)" />

  <!-- Header -->
  <rect x="20" y="16" width="920" height="44" rx="6" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <circle cx="42" cy="38" r="4" fill="#10b981" />
  <text x="56" y="42" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">FACTORY RELIABILITY ARCHITECTURE // THERMAL REGULATION &amp; STROBE VISION</text>
  <rect x="730" y="27" width="190" height="22" rx="4" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
  <text x="825" y="42" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">Factory Floor Uptime: 99.9%</text>

  <!-- Left: IP54 Positive-Pressure Enclosure -->
  <g transform="translate(30, 80)">
    <rect width="280" height="360" rx="8" fill="#0c1322" stroke="#38bdf8" stroke-width="1.5" />
    <rect width="280" height="34" rx="8" fill="rgba(56, 189, 248, 0.15)" />
    <text x="14" y="22" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">01 // POSITIVE-PRESSURE ENCLOSURE</text>

    <rect x="14" y="60" width="252" height="84" rx="4" fill="#080d18" stroke="rgba(255,255,255,0.08)" />
    <text x="24" y="82" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">IP54 Sealed Environmental Box</text>
    <text x="24" y="100" fill="#94a3b8" font-family="monospace" font-size="9.5">Dual High-Static Pressure Intake Fans</text>
    <text x="24" y="118" fill="#38bdf8" font-family="monospace" font-size="9.5">Cleanable HEPA Intake Particulate Filter</text>
    <text x="24" y="132" fill="#cbd5e1" font-family="monospace" font-size="8.5">Positive Outflow: Blocks factory airborne dust</text>

    <rect x="14" y="158" width="252" height="90" rx="4" fill="#080d18" stroke="rgba(255,255,255,0.08)" />
    <text x="24" y="180" fill="#f8fafc" font-family="sans-serif" font-size="11.5" font-weight="bold">Phase-Change Thermal Interface</text>
    <text x="24" y="200" fill="#cbd5e1" font-family="monospace" font-size="9">• 8.5 W/m-K High-Conductivity Pad</text>
    <text x="24" y="218" fill="#cbd5e1" font-family="monospace" font-size="9">• Direct-to-chassis heat pipe routing</text>
    <text x="24" y="234" fill="#cbd5e1" font-family="monospace" font-size="9">• Sustained operation at 44°C ambient</text>

    <rect x="14" y="262" width="252" height="68" rx="4" fill="#080d18" stroke="rgba(255,255,255,0.08)" />
    <text x="24" y="284" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">Silicon Thermal Reduction</text>
    <text x="24" y="302" fill="#94a3b8" font-family="monospace" font-size="9">Junction temp dropped from 86°C to 61°C</text>
    <text x="24" y="318" fill="#10b981" font-family="monospace" font-size="8.5">Zero thermal frequency throttling trips</text>
  </g>

  <!-- Flow 1 to 2 -->
  <path d="M 310 260 L 350 260" stroke="#38bdf8" stroke-width="2" fill="none" />
  <polygon points="350,256 358,260 350,264" fill="#38bdf8" />

  <!-- Center: Predictive Telemetry & Dynamic Batching -->
  <g transform="translate(358, 80)">
    <rect width="280" height="360" rx="8" fill="#0c1322" stroke="#10b981" stroke-width="1.5" />
    <rect width="280" height="34" rx="8" fill="rgba(16, 185, 129, 0.15)" />
    <text x="14" y="22" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">02 // PREDICTIVE GPU REGULATION</text>

    <rect x="14" y="60" width="252" height="84" rx="4" fill="#080d18" stroke="rgba(255,255,255,0.08)" />
    <text x="24" y="82" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Telemetry Heartbeat Daemon</text>
    <text x="24" y="100" fill="#94a3b8" font-family="monospace" font-size="9.5">500ms sysfs Thermal Zone Polling</text>
    <text x="24" y="118" fill="#34d399" font-family="monospace" font-size="9.5">Continuous GPU / CPU / DLA Power Tracking</text>
    <text x="24" y="132" fill="#cbd5e1" font-family="monospace" font-size="8.5">Live TimescaleDB telemetry streaming</text>

    <rect x="14" y="158" width="252" height="90" rx="4" fill="#080d18" stroke="rgba(16, 185, 129, 0.2)" />
    <text x="24" y="180" fill="#34d399" font-family="sans-serif" font-size="11.5" font-weight="bold">Dynamic Workload Governor</text>
    <text x="24" y="200" fill="#cbd5e1" font-family="monospace" font-size="9">• T &lt; 76°C: Full Batch 4 Inference</text>
    <text x="24" y="218" fill="#cbd5e1" font-family="monospace" font-size="9">• T &gt; 78°C: Step batch to 2 (graceful fallback)</text>
    <text x="24" y="234" fill="#cbd5e1" font-family="monospace" font-size="9">• Alert trigger to facility SCADA dashboard</text>

    <rect x="14" y="262" width="252" height="68" rx="4" fill="#080d18" stroke="rgba(255,255,255,0.08)" />
    <text x="24" y="284" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Buffer Starvation Protection</text>
    <text x="24" y="302" fill="#94a3b8" font-family="monospace" font-size="9">Inference latency remains pinned &lt; 45ms</text>
    <text x="24" y="318" fill="#10b981" font-family="monospace" font-size="8.5">Zero picking arm collision halts</text>
  </g>

  <!-- Flow 2 to 3 -->
  <path d="M 638 260 L 678 260" stroke="#10b981" stroke-width="2" fill="none" />
  <polygon points="678,256 686,260 678,264" fill="#10b981" />

  <!-- Right: Microsecond Strobe Illumination -->
  <g transform="translate(686, 80)">
    <rect width="244" height="360" rx="8" fill="#0c1322" stroke="#f59e0b" stroke-width="1.5" />
    <rect width="244" height="34" rx="8" fill="rgba(245, 158, 11, 0.15)" />
    <text x="14" y="22" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">03 // SYNCHRONIZED STROBE</text>

    <rect x="14" y="60" width="216" height="84" rx="4" fill="#080d18" stroke="rgba(255,255,255,0.08)" />
    <text x="24" y="82" fill="#f8fafc" font-family="sans-serif" font-size="11.5" font-weight="bold">Hardware Optocoupler Trigger</text>
    <text x="24" y="100" fill="#94a3b8" font-family="monospace" font-size="9.5">Camera GPIO Pin Strobe Pulse</text>
    <text x="24" y="118" fill="#f59e0b" font-family="monospace" font-size="9.5">Sub-microsecond synchronization</text>
    <text x="24" y="132" fill="#34d399" font-family="monospace" font-size="8.5">Jitter: &lt; 2.0 microseconds</text>

    <rect x="14" y="158" width="216" height="90" rx="4" fill="#080d18" stroke="rgba(255,255,255,0.08)" />
    <text x="24" y="180" fill="#f8fafc" font-family="sans-serif" font-size="11.5" font-weight="bold">80,000 Lux LED Pulse</text>
    <text x="24" y="200" fill="#cbd5e1" font-family="monospace" font-size="9">• 150us ultra-short pulse duration</text>
    <text x="24" y="218" fill="#cbd5e1" font-family="monospace" font-size="9">• Overpowers forklift &amp; sun glare</text>
    <text x="24" y="234" fill="#cbd5e1" font-family="monospace" font-size="9">• Freezes 2.5 m/s conveyor speed</text>

    <rect x="14" y="262" width="216" height="68" rx="4" fill="#080d18" stroke="rgba(255,255,255,0.08)" />
    <text x="24" y="284" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">Consistent Neural Inference</text>
    <text x="24" y="302" fill="#94a3b8" font-family="monospace" font-size="9">False positive rate dropped &lt; 0.08%</text>
    <text x="24" y="318" fill="#10b981" font-family="monospace" font-size="8.5">Night/day invariant lighting</text>
  </g>
</svg>
