<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="240 FPS Real-Time Trajectory Prediction and Intercept Architecture">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <pattern id="grid3" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.8" />
    </pattern>
  </defs>

  <rect width="960" height="480" fill="url(#bgGrad3)" />
  <rect width="960" height="480" fill="url(#grid3)" />

  <!-- Header -->
  <rect x="20" y="16" width="920" height="44" rx="6" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <circle cx="42" cy="38" r="4" fill="#f59e0b" />
  <text x="56" y="42" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">REAL-TIME TRAJECTORY ARCHITECTURE // 240 FPS OPTICAL INTERCEPT</text>
  <rect x="730" y="27" width="190" height="22" rx="4" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" />
  <text x="825" y="42" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">Photon-to-Torque: &lt; 7.0ms</text>

  <!-- Left: 240 FPS Camera -->
  <g transform="translate(30, 80)">
    <rect width="210" height="360" rx="8" fill="#0c1322" stroke="#38bdf8" stroke-width="1.5" />
    <rect width="210" height="34" rx="8" fill="rgba(56, 189, 248, 0.15)" />
    <text x="14" y="22" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">01 // 240 FPS CMOS SENSOR</text>

    <rect x="14" y="60" width="182" height="74" rx="4" fill="#080d18" stroke="rgba(255,255,255,0.08)" />
    <text x="24" y="82" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Global Shutter Sensor</text>
    <text x="24" y="100" fill="#94a3b8" font-family="monospace" font-size="9.5">4.16ms Exposure Inter-Frame</text>
    <text x="24" y="118" fill="#38bdf8" font-family="monospace" font-size="9">Zero Motion Blur @ 8.0 m/s</text>

    <rect x="14" y="148" width="182" height="100" rx="4" fill="#080d18" stroke="rgba(255,255,255,0.08)" />
    <text x="24" y="170" fill="#f8fafc" font-family="sans-serif" font-size="11.5" font-weight="bold">Localized Region of Interest</text>
    <text x="24" y="190" fill="#cbd5e1" font-family="monospace" font-size="9">• 640x480 Cropped ROI</text>
    <text x="24" y="208" fill="#cbd5e1" font-family="monospace" font-size="9">• RAM Lookup Table (LUT)</text>
    <text x="24" y="226" fill="#cbd5e1" font-family="monospace" font-size="9">• High-speed HSV isolation</text>
    <text x="24" y="240" fill="#10b981" font-family="monospace" font-size="8.5">Extract Centroid: &lt; 0.9ms</text>

    <rect x="14" y="262" width="182" height="68" rx="4" fill="#080d18" stroke="rgba(255,255,255,0.08)" />
    <text x="24" y="284" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">USB3 Vision Bus</text>
    <text x="24" y="302" fill="#94a3b8" font-family="monospace" font-size="9">Direct DMA Ring Buffer</text>
    <text x="24" y="318" fill="#38bdf8" font-family="monospace" font-size="8.5">Frame Delivery: &lt; 0.4ms</text>
  </g>

  <!-- Flow 1 to 2 -->
  <path d="M 240 260 L 280 260" stroke="#38bdf8" stroke-width="2" fill="none" />
  <polygon points="280,256 288,260 280,264" fill="#38bdf8" />

  <!-- Center: Physics & Rebound Kinematics -->
  <g transform="translate(288, 80)">
    <rect width="360" height="360" rx="8" fill="#0c1322" stroke="#10b981" stroke-width="1.5" />
    <rect width="360" height="34" rx="8" fill="rgba(16, 185, 129, 0.15)" />
    <text x="14" y="22" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">02 // SPECULAR REBOUND &amp; TRAJECTORY FORECASTER</text>

    <rect x="14" y="60" width="332" height="84" rx="4" fill="#080d18" stroke="rgba(255,255,255,0.08)" />
    <text x="24" y="82" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Least-Squares Velocity Estimation</text>
    <text x="24" y="100" fill="#94a3b8" font-family="monospace" font-size="9.5">Linear regression through 4 centroid coordinates</text>
    <text x="24" y="118" fill="#34d399" font-family="monospace" font-size="9.5">Calculates instantaneous vector [Vx, Vy] in Cartesian plane</text>
    <text x="24" y="132" fill="#cbd5e1" font-family="monospace" font-size="8.5">Puck Speed Detection: 0.1 m/s to 8.2 m/s</text>

    <rect x="14" y="158" width="332" height="96" rx="4" fill="#080d18" stroke="rgba(16, 185, 129, 0.25)" />
    <text x="24" y="180" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">Rail Collision &amp; Elastic Damping Model</text>
    <text x="24" y="200" fill="#cbd5e1" font-family="monospace" font-size="9.5">• Specular reflection angle theta_out = theta_in</text>
    <text x="24" y="218" fill="#cbd5e1" font-family="monospace" font-size="9.5">• Coefficient of restitution attenuation: e = 0.92</text>
    <text x="24" y="236" fill="#cbd5e1" font-family="monospace" font-size="9.5">• Dual-bank rebound intercept solver</text>
    <text x="24" y="250" fill="#34d399" font-family="monospace" font-size="8.5">Trajectory Solving Compute: &lt; 1.2ms</text>

    <rect x="14" y="268" width="332" height="66" rx="4" fill="#080d18" stroke="rgba(255,255,255,0.08)" />
    <text x="24" y="290" fill="#f59e0b" font-family="sans-serif" font-size="11.5" font-weight="bold">Defensive Intercept Arc Calculator</text>
    <text x="24" y="308" fill="#94a3b8" font-family="monospace" font-size="9.5">Calculates striker contact position on boundary defensive curve</text>
    <text x="24" y="322" fill="#34d399" font-family="monospace" font-size="8.5">Defense Accuracy: &gt; 92% successful blocks</text>
  </g>

  <!-- Flow 2 to 3 -->
  <path d="M 648 260 L 688 260" stroke="#10b981" stroke-width="2" fill="none" />
  <polygon points="688,256 696,260 688,264" fill="#10b981" />

  <!-- Right: SCARA IK & Drive -->
  <g transform="translate(696, 80)">
    <rect width="234" height="360" rx="8" fill="#0c1322" stroke="#f59e0b" stroke-width="1.5" />
    <rect width="234" height="34" rx="8" fill="rgba(245, 158, 11, 0.15)" />
    <text x="14" y="22" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">03 // 4-DOF SCARA ACTUATION</text>

    <rect x="14" y="60" width="206" height="84" rx="4" fill="#080d18" stroke="rgba(255,255,255,0.08)" />
    <text x="24" y="82" fill="#f8fafc" font-family="sans-serif" font-size="11.5" font-weight="bold">Inverse Kinematics (IK)</text>
    <text x="24" y="100" fill="#94a3b8" font-family="monospace" font-size="9.5">Cartesian to Joint Space</text>
    <text x="24" y="118" fill="#f59e0b" font-family="monospace" font-size="9.5">Analytical 2-link solver</text>
    <text x="24" y="132" fill="#34d399" font-family="monospace" font-size="8.5">Solve Time: &lt; 0.15ms</text>

    <rect x="14" y="158" width="206" height="90" rx="4" fill="#080d18" stroke="rgba(255,255,255,0.08)" />
    <text x="24" y="180" fill="#f8fafc" font-family="sans-serif" font-size="11.5" font-weight="bold">Jerk-Limited S-Curves</text>
    <text x="24" y="200" fill="#cbd5e1" font-family="monospace" font-size="9">• Minimizes chassis vibration</text>
    <text x="24" y="218" fill="#cbd5e1" font-family="monospace" font-size="9">• Prevents striker overshoot</text>
    <text x="24" y="234" fill="#cbd5e1" font-family="monospace" font-size="9">• High-speed strike triggers</text>

    <rect x="14" y="262" width="206" height="68" rx="4" fill="#080d18" stroke="rgba(255,255,255,0.08)" />
    <text x="24" y="284" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">ROS 2 Joint Controller</text>
    <text x="24" y="302" fill="#94a3b8" font-family="monospace" font-size="9">EtherCAT / CAN Servo Drives</text>
    <text x="24" y="318" fill="#10b981" font-family="monospace" font-size="8.5">Total Loop Execution: &lt; 7.0ms</text>
  </g>
</svg>
